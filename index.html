    <meta name="twitter:images" content="https://toldoscampestre.com.br/images/compartilhamento.jpg">

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- FONTES -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Paleta Identidade Visual */
            --primary-dark: #0f4c3a;
            --accent-green: #82c877;
            --bg-white: #ffffff;
            --bg-light: #f8f9fa;
            --text-dark: #2d3436;
            --text-gray: #636e72;
            --transition: all 0.3s ease;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        /* HEADER */

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: transparent;
            z-index: 1000;
            transition: var(--transition);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 25px rgba(0,0,0,0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .brand-container {
            display: block;
        }

        /* LOGO PNG TRANSPARENTE */

        .logo-img {
            width: 180px;
            height: 90px;
            border-radius: 4px;
            object-fit: contain;

            /* ALTERADO */
            background: transparent;
            border: none;
            box-shadow: none;

            transition: var(--transition);
            display: block;
        }

        header.scrolled .logo-img {
            width: 160px;
            height: 80px;

            /* ALTERADO */
            border: none;
            box-shadow: none;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            align-items: center;
        }

        nav ul li a {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        nav a.active {
            color: var(--accent-green);
            font-weight: 600;
        }

        nav a:hover {
            color: var(--accent-green);
        }

        header.scrolled nav ul li a {
            color: var(--text-dark);
        }

        header.scrolled nav a.active {
            color: var(--primary-dark);
            font-weight: 700;
        }

        header.scrolled nav a:hover {
            color: var(--primary-dark);
        }

        /* BOTÃO */

        .cta-header {
            background: var(--primary-dark);
            color: white !important;
            padding: 0.7rem 1.6rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(15, 76, 58, 0.2);
        }

        header:not(.scrolled) .cta-header {
            background: rgba(15, 76, 58, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .cta-header:hover {
            background: var(--accent-green) !important;
            color: var(--primary-dark) !important;
            transform: translateY(-2px);
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(130, 200, 119, 0.4);
        }

        /* MENU MOBILE */

        .mobile-toggle {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ffffff;
            transition: var(--transition);
        }

        header.scrolled .mobile-toggle {
            color: var(--primary-dark);
        }

        /* HERO */

        .hero {
            height: 100vh;
            background:
                linear-gradient(rgba(15, 76, 58, 0.7), rgba(0, 0, 0, 0.5)),
                url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80');

            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 0 5%;
        }

        .hero-content h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            margin-bottom: 1.5rem;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .hero-content p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            margin-bottom: 2.5rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.95;
        }

        /* SEÇÕES */

        .section {
            padding: 100px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 2.5rem;
            color: var(--primary-dark);
        }

        .section-subtitle {
            text-align: center;
            margin-bottom: 4rem;
            color: var(--text-gray);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* SOBRE */

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-image {
            width: 100%;
            border-radius: var(--radius);
            box-shadow: 20px 20px 0 var(--accent-green);
        }

        .diff-icons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .diff-item {
            text-align: center;
            padding: 1.5rem;
            background: var(--bg-light);
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .diff-item:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        .diff-item i {
            font-size: 2.2rem;
            color: var(--primary-dark);
            margin-bottom: 0.8rem;
        }

        /* PRODUTOS */

        .products-bg {
            background: #ffffff;
            padding: 100px 5%;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .product-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.15);
        }

        .product-img {
            width: 100%;
            height: 260px;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
            display: block;
        }

        .product-card:hover .product-img img {
            transform: scale(1.12);
        }

        .product-info {
            padding: 30px;
        }

        .product-info h3 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #111;
            font-weight: 700;
        }

        .product-info p {
            color: var(--text-gray);
            line-height: 1.7;
            font-size: 15px;
        }

        /* PORTFÓLIO */

        #portfolio {
            padding: 100px 5%;
            background: var(--bg-light);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .portfolio-item {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            height: 340px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: 0.4s ease;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
            display: block;
        }

        .portfolio-item:hover img {
            transform: scale(1.12);
        }

        .portfolio-item:hover {
            transform: translateY(-8px);
        }

        .portfolio-overlay {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            padding: 30px 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.05));
            color: #fff;
        }

        .portfolio-overlay h4 {
            font-size: 20px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .portfolio-overlay p {
            font-size: 14px;
            color: var(--accent-green);
            opacity: 0.95;
        }

        /* HISTÓRIA */

        .contact-cta {
            background: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 90px 5%;
        }

        .contact-cta h2 {
            font-size: 2.4rem;
            margin-bottom: 1.5rem;
            font-family: 'Montserrat', sans-serif;
        }

        .contact-cta p {
            margin-bottom: 1.5rem;
            opacity: 0.9;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        /* FOOTER */

        footer {
            background: #0a3528;
            color: rgba(255, 255, 255, 0.8);
            padding: 5rem 5% 2rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
            max-width: 1200px;
            margin: 0 auto 3rem auto;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
        }

        /* LOGO FOOTER */

        .footer-col .logo-img {
            width: 200px;
            height: 100px;
            margin-bottom: 1.5rem;

            /* ALTERADO */
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .footer-description {
            max-width: 450px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .footer-title {
            color: white;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }

        .footer-contact-item i {
            color: var(--accent-green);
            width: 20px;
            font-size: 1.1rem;
        }

        .social-icons {
            margin-top: 1rem;
        }

        .social-icons a {
            font-size: 1.6rem;
            margin-right: 1.5rem;
            color: white;
            display: inline-block;
        }

        .social-icons a:hover {
            color: var(--accent-green);
            transform: translateY(-2px);
        }

        .footer-bottom {
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }

        .footer-bottom-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dev-credits a {
            color: var(--accent-green);
            font-weight: 600;
        }

        .dev-credits a:hover {
            text-decoration: underline;
        }

        /* BOTÃO WHATSAPP */

        .whatsapp-fixed {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .whatsapp-fixed:hover {
            transform: scale(1.1);
            background: #20ba5a;
        }

        /* RESPONSIVO */

        @media (max-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .portfolio-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {

            nav ul {
                display: none;
            }

            .cta-header {
                display: none;
            }

            .mobile-toggle {
                display: block;
            }

            .grid-2 {
                grid-template-columns: 1fr;
                gap: 3rem;
            }

            .about-image {
                box-shadow: 12px 12px 0 var(--accent-green);
            }

            .product-grid,
            .portfolio-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .product-img {
                height: 240px;
            }

            .portfolio-item {
                height: 280px;
            }

            .footer-grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }

            .footer-bottom-container {
                flex-direction: column;
                text-align: center;
            }

            .logo-img {
                width: 150px;
                height: 75px;
            }

            header.scrolled .logo-img {
                width: 140px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

<header id="site-header">

    <div class="nav-container">

        <div class="brand-container">
            <a href="#">

                <img src="images/logo.png" alt="Logo Toldos Campestre" class="logo-img">
            </a>
        </div>

        <nav>
            <ul id="nav-links">
                <li><a href="#home" class="active">Início</a></li>

                <li><a href="#produtos">Soluções</a></li>
                <li><a href="#portfolio">Portfólio</a></li>
            </ul>
        </nav>

        <a href="https://wa.me/5531986238781?text=Olá,%20gostaria%20de%20fazer%20um%20orçamento%20de%20toldo." target="_blank" class="cta-header">
            Orçamento Rápido
        </a>

        <div class="mobile-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>

    </div>

</header>
