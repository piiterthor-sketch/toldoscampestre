<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toldos Campestre | Proteção, Conforto e Elegância</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Paleta extraída da Identidade Visual */
            --primary-dark: #0f4c3a; /* Verde Escuro Premium */
            --accent-green: #82c877; /* Verde Folha Claro */
            --bg-white: #ffffff;
            --bg-light: #f8f9fa;
            --text-dark: #2d3436;
            --text-gray: #636e72;
            --transition: all 0.3s ease;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        a { text-decoration: none; color: inherit; transition: var(--transition); }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Campo para Logomarca à Esquerda */
        .brand-container {
            display: flex;
            align-items: center;
        }

        .logo-text {
            font-size: 1.5rem;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: -0.5px;
            font-weight: 800;
        }

        .logo-text span { 
            color: var(--accent-green); 
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a:hover, nav a.active { color: var(--accent-green); }

        .cta-header {
            background: var(--primary-dark);
            color: white !important;
            padding: 0.6rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
        }

        .cta-header:hover {
            background: var(--accent-green);
            color: var(--primary-dark) !important;
            transform: translateY(-2px);
        }

        /* --- MOBILE MENU --- */
        .mobile-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary-dark);
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(15, 76, 58, 0.7), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 0 5%;
        }

        .hero-content h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-pulse {
            display: inline-block;
            background: var(--accent-green);
            color: var(--primary-dark);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(130, 200, 119, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(130, 200, 119, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(130, 200, 119, 0); }
        }

        /* --- CONFIGURAÇÕES DE SEÇÃO --- */
        .section { padding: 90px 5%; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; margin-bottom: 1rem; font-size: 2.5rem; color: var(--primary-dark); }
        .section-subtitle { text-align: center; margin-bottom: 4rem; color: var(--text-gray); max-width: 600px; margin-left: auto; margin-right: auto; }
        
        /* --- QUEM SOMOS --- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-image {
            width: 100%;
            border-radius: var(--radius);
            box-shadow: 20px 20px 0 var(--accent-green);
        }

        .diff-icons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .diff-item {
            text-align: center;
            padding: 1.2rem;
            background: var(--bg-light);
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .diff-item:hover { transform: translateY(-5px); background: white; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .diff-item i {
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        /* --- PRODUTOS --- */
        .products-bg { background: var(--bg-light); }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-10px);
        }

        .product-img { height: 220px; background-size: cover; background-position: center; }

        .product-info { padding: 1.5rem; }
        .product-info h3 { margin-bottom: 0.5rem; color: var(--primary-dark); font-size: 1.25rem; }
        .product-info p { color: var(--text-gray); font-size: 0.95rem; }

        /* --- PORTFÓLIO (Grade de 6 Fotos Ampliada) --- */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .portfolio-item {
            position: relative;
            height: 280px;
            background-size: cover;
            background-position: center;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .portfolio-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent, rgba(15, 76, 58, 0.9));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            opacity: 0;
            transition: var(--transition);
        }

        .portfolio-item:hover .portfolio-overlay { opacity: 1; }
        
        .portfolio-overlay h4 { color: white; font-family: 'Montserrat', sans-serif; font-size: 1.1rem; }
        .portfolio-overlay p { color: var(--accent-green); font-size: 0.85rem; }

        /* --- CONTATO / CONVERSÃO --- */
        .contact-cta {
            background: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 80px 5%;
        }

        .contact-cta h2 { font-size: 2.2rem; margin-bottom: 1rem; }
        .contact-cta p { margin-bottom: 2rem; opacity: 0.9; max-width: 600px; margin-left: auto; margin-right: auto; }
        
        .btn-whatsapp-large {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #25d366;
            color: white;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp-large:hover {
            background: #20ba5a;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(37, 211, 102, 0.5);
        }

        /* --- FOOTER --- */
        footer {
            background: #0a3528;
            color: rgba(255, 255, 255, 0.8);
            padding: 5rem 5% 2rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 4rem;
            max-width: 1200px;
            margin: 0 auto 3rem auto;
        }

        .footer-logo { font-size: 1.4rem; color: white; margin-bottom: 1rem; text-transform: uppercase; font-weight: 800;}
        .footer-logo span { color: var(--accent-green); }

        .footer-title { color: white; font-family: 'Montserrat', sans-serif; margin-bottom: 1.5rem; font-size: 1.1rem; }
        .footer-links { list-style: none; }
        .footer-links li { margin-bottom: 0.8rem; }
        .footer-links a:hover { color: var(--accent-green); padding-left: 5px; }

        .social-icons a {
            font-size: 1.5rem;
            margin-right: 1.2rem;
            color: white;
        }
        .social-icons a:hover { color: var(--accent-green); }

        .footer-bottom {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }

        /* --- BOTÃO FLUTUANTE --- */
        .whatsapp-fixed {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .whatsapp-fixed:hover { transform: scale(1.1); background: #20ba5a; }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 992px) {
            .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            nav ul { display: none; }
            .cta-header { display: none; }
            .mobile-toggle { display: block; }
            .grid-2 { grid-template-columns: 1fr; gap: 3rem; }
            .about-image { box-shadow: 12px 12px 0 var(--accent-green); }
            .portfolio-grid { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr; gap: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="brand-container">
                <a href="#" class="logo-text">Toldos <span>Campestre</span></a>
            </div>
            
            <nav>
                <ul id="nav-links">
                    <li><a href="#home" class="active">Início</a></li>
                    <li><a href="#sobre">Quem Somos</a></li>
                    <li><a href="#produtos">Soluções</a></li>
                    <li><a href="#portfolio">Portfólio</a></li>
                </ul>
            </nav>
            
            <a href="https://wa.me/5511999998888?text=Olá,%20gostaria%20de%20fazer%20um%20orçamento%20de%20toldo." target="_blank" class="cta-header">Orçamento Rápido</a>
            
            <div class="mobile-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
        </div>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Proteção, Confort
